apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: uat1-capi
  namespace: cpeters-uat1-z4w5j
spec:
  description: UAT1 Supervisor Cluster Lifecycle Management
  sourceRepos:
    - https://github.com/cpetersbcom/nt-vks-gitops.git
  destinations:
    - name: uat1-supervisor
      namespace: cpeters-uat1-z4w5j
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: 'argoproj.io'
      kind: Application
    - group: 'argoproj.io'
      kind: AppProject
    - group: 'argoproj.io'
      kind: ApplicationSet
    - group: 'argocd-service.vsphere.vmware.com'
      kind: EntityManagementPolicy
    - group: 'argocd-service.vsphere.vmware.com'
      kind: ManagedEntity
    - group: 'cluster.x-k8s.io'
      kind: Cluster
    - group: 'addons.kubernetes.vmware.com'
      kind: AddonInstall
  # Todo: Implement groups for fine grained access control
  roles:
    - name: observer
      groups:
        - christopher.peters@broadcom.com
      policies:
        - p, proj:uat1-capi:observer, applications, get, platform-bootstrap/*, allow
    - name: operator
      groups:
        - christopher.peters@broadcom.com
      policies:
        - p, proj:uat1-capi:operator, applications, get, uat1-capi/*, allow
        - p, proj:uat1-capi:operator, applications, sync, uat1-capi/*, allow
