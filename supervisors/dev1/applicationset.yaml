apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev1-capi
  namespace: cpeters-dev1-zg2v4
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/cpetersbcom/nt-vks-gitops.git
      revision: HEAD
      files:
      - path: supervisors/dev1/cluster-*.yaml
  template:
    metadata:
      name: 'dev1-{{ trimSuffix ".yaml" .path.filenameNormalized }}'
    spec:
      project: dev1-capi
      source:
        repoURL: https://github.com/cpetersbcom/nt-vks-gitops.git
        targetRevision: HEAD
        path: 'supervisors/dev1'
        directory:
          include: '{{ .path.filename }}'
      destination:
        server: https://auto.vcf02.showcase.tmm.broadcom.lab/proxy/k8s/namespaces/urn:vcloud:namespace:33133489-84b6-404f-b5f2-6c59298d5858
        namespace: cpeters-dev1-zg2v4
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
        - CreateNamespace=false
  syncPolicy:
    # Prevents ApplicationSet controller from modifying or deleting Applications
    applicationsSync: create-only
    # Prevent an Application's child resources from being deleted, when the parent Application is deleted
    preserveResourcesOnDeletion: true
