apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev1-capi
  namespace: cpeters-ct6l9
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/cpetersbcom/nt-vks-gitops.git
      revision: HEAD
      files:
      - path: supervisors/dev1/*/cluster.yaml
  template:
    metadata:
      name: 'dev1-{{.path.basename}}-cluster'
    spec:
      project: dev1-capi
      source:
        repoURL: https://github.com/cpetersbcom/nt-vks-gitops.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://auto.vcf02.showcase.tmm.broadcom.lab/proxy/k8s/namespaces/urn:vcloud:namespace:26599f2b-e6ea-4bba-ae22-9229d8f12245
        namespace: cpeters-ct6l9
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
        - CreateNamespace=false
  syncPolicy:
    # Prevents ApplicationSet controller from modifying or deleting Applications
    applicationsSync: create-only
    # Prevent an Application's child resources from being deleted, when the parent Application is deleted
    preserveResourcesOnDeletion: true
